<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Native pipe |> drawn as shapes (no font dependency). Colors from custom.scss:
       $body-bg #1a1a1e, $presentation-heading-color #7ec87e. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#25252b"/>
      <stop offset="1" stop-color="#121215"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <g id="pipe">
      <rect x="580" y="130" width="120" height="820" rx="60" stroke="none"/>
      <polyline points="900,190 1280,540 900,890" fill="none" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- soft halo behind the glyph -->
  <use href="#pipe" fill="#7ec87e" stroke="#7ec87e" opacity="0.35" filter="url(#glow)"/>

  <use href="#pipe" fill="#7ec87e" stroke="#7ec87e"/>
</svg>
